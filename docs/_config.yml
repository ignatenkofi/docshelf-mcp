title: docshelf-mcp
description: "Put your manuals on a shelf, hand the AI the index."
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# GitHub Pages site config
url: "https://ignatenkofi.github.io"
baseurl: "/docshelf-mcp"

# SEO
author: ignatenkofi
twitter:
  card: summary

# Hide README and other files from the rendered site
exclude:
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
