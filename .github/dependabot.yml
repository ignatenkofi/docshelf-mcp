version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep Python dependencies (declared in pyproject.toml) fresh.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # The `mcp>=1.2.0,<2` pin in pyproject.toml is load-bearing, not stale:
      # mcp 2.0.0 removed `mcp.server.fastmcp` outright, and `server.py`
      # imports `FastMCP` and `FunctionResource` from it. Dependabot has no
      # way to see that, so it keeps proposing to widen the ceiling (PR #82,
      # CI red on all six matrix jobs). Suppress the major here so the
      # proposal does not come back every week; the migration itself is
      # tracked as an issue, deliberately, because an ignore rule with no
      # ticket behind it is exactly the silent automation this portfolio
      # keeps finding.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
