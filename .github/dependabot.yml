version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    ignore:
      # The shared DevSecOps pipeline is followed by its major tag `@v1` on
      # purpose (security.yml), like the sibling repos. Dependabot re-pins
      # such a ref to the newest v1.x.y whenever `v1` lags behind it — #87
      # turned `@v1` into `@v1.2.0` exactly that way, and the pin then sat
      # four minors behind because nothing moved it. Only a new major is
      # worth a PR here.
      - dependency-name: "ignatenkofi/devsecops-pipeline-public/.github/workflows/pipeline-light.yml"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Keep Python dependencies (declared in pyproject.toml) fresh.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # No `ignore` for mcp any more: the rule existed only to stop dependabot
    # re-proposing mcp 2.x every week while `server.py` still imported
    # `FastMCP`, and that port landed (#83). The next major will need the same
    # treatment — a port plus a run of tests/test_stdio_protocol.py — but
    # suppressing it before it exists would hide the proposal rather than
    # answer it.
    ignore:
      # marker-pdf is the opposite case: the major exists, the proposal was
      # made (#92 widened the ceiling to `<3`) and it was answered — reverted
      # to `<2`, because nothing here can judge 2.x. marker-pdf is not in the
      # `dev` extra (it pulls PyTorch), so CI never imports it and a green
      # check says nothing about the new major. Minor/patch bumps still
      # arrive as PRs; the major waits for a deliberate port with a real run.
      - dependency-name: "marker-pdf"
        update-types: ["version-update:semver-major"]
