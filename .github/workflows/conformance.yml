name: shelf-conformance
# ADR-0005 (shelf-spec) back-compat obligation: the reference implementation
# validates its output format against the spec in CI. This job scaffolds a
# fresh shelf with docshelf-mcp's own tools and runs `shelf-spec validate`
# on it, so format drift between implementation and spec surfaces on PRs.
#
# Blocking since 2026-09-09 (owner's decision; supersedes the "flip at v1"
# plan in #64): every run so far has been green, and an advisory stage is a
# stage nobody reads — main-memshelf carried a real violation in its
# advisory log for two weeks while the check stayed green.
#
# shelf-spec is a public repository now, so the tip install needs no
# credential: SHELF_SPEC_TOKEN and the HAVE_TOKEN gate are gone together
# with the hazard they guarded. Tip rather than the PyPI release on
# purpose — this job checks the implementation against the spec as it
# currently stands, not as it was last cut (docs/advisory-ci.md there).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docshelf-mcp (this checkout) and shelf-spec (tip)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/ignatenkofi/shelf-spec.git"

      - name: Scaffold a shelf with docshelf-mcp's own tools
        run: |
          mkdir -p /tmp/ci-shelf
          cd /tmp/ci-shelf
          python - <<'PY'
          from pathlib import Path
          from docshelf_mcp.core.shelf import Shelf

          shelf = Shelf(Path("."))
          shelf.init(
              name="ci-conformance",
              default_categories=["guides", "notes"],
              # The shelf.yml under test is the one docshelf writes (#63),
              # not a hand-written stand-in.
              manifest=True,
          )
          doc = Path("sample.md")
          doc.write_text(
              "# Sample guide\n\nA short body for conformance checking.\n",
              encoding="utf-8",
          )
          shelf.add_document(
              doc, category="guides", title="sample-guide", description="CI fixture"
          )
          doc.unlink()  # the source file is input, not shelf content
          PY

      - name: Validate against shelf-spec (docshelf's own manifest, strict)
        # Exit contract: 0 conforms, 1 spec violations — or, with --strict,
        # any warning — 2 config-error. The manifest is the shelf.yml that
        # `init(manifest=True)` wrote above; a hand-written candidate in
        # tests/fixtures used to stand in for it, so the job validated a file
        # docshelf never emits. --strict because the finding a broken
        # scaffold produces, `stale-index` (INDEX.md missing or not listing a
        # document), is a warning: without the flag it left the job green.
        run: |
          cat /tmp/ci-shelf/shelf.yml
          shelf-spec validate --ci --strict /tmp/ci-shelf
