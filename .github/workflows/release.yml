name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Tag v* -> gate (lint, tests, tag = __version__) -> build -> PyPI -> GitHub
# Release. Trusted publishing on PyPI uses OIDC — no secrets required.
# Configure on PyPI: https://pypi.org/manage/account/publishing/
permissions:
  contents: write   # to create GitHub Releases
  id-token: write   # to mint the OIDC token for PyPI

jobs:
  gate:
    name: Gate (lint, tests, tag = version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tag matches __version__
        # A tag that disagrees with the package would publish one version
        # under another's name. A workflow_dispatch run has no tag to
        # compare, so the step is skipped there rather than failed.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(python -c "import docshelf_mcp; print(docshelf_mcp.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag v$TAG != __version__ $PKG"; exit 1; }

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests
        run: |
          # Same precondition as ci.yml: the PDF tests importorskip
          # pymupdf4llm, and a skip here would read as a green gate.
          python -c "import pymupdf4llm"
          pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/docshelf-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password:` — OIDC trusted publishing is used.
          # Make sure PyPI -> Project -> Publishing has this repo configured.
          print-hash: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Tag pushes only: a workflow_dispatch run would otherwise create a
    # release named after the branch (the same guard shelf-spec carries).
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog entry for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          python - <<'PY' > release_notes.md
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # match "## [VERSION] ..." up to next "## [" or end-of-file
          pattern = re.compile(
              rf"##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)",
              re.DOTALL,
          )
          m = pattern.search(text)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Release {version}. See CHANGELOG.md for details.")
          PY
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
