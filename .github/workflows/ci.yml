name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full version spread on Linux; one smoke run each on Windows/macOS
        # (the tool is aimed at desktop clients and does a lot of path work).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          # The PDF conversion tests importorskip pymupdf4llm. Since it left
          # core for the `pdf` extra (#93) it reaches CI only through `dev`;
          # if that ever dropped, the skips would read green. Fail loudly.
          python -c "import pymupdf4llm"
          pytest -v --cov=docshelf_mcp --cov-report=term-missing --cov-fail-under=85

  smoke:
    name: Server smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke check
        run: |
          python -c "from docshelf_mcp.server import mcp; print('OK', mcp)"
          python -c "from docshelf_mcp.core.shelf import Shelf; print('OK', Shelf)"

      - name: Console script smoke
        run: |
          docshelf-mcp --version
          docshelf-mcp --help

      # No real PII in the tree (the pattern the sibling repos follow, pii-mcp's
      # own CI first): `pii-mcp verify .` over the checkout, with the baseline
      # accepting the known synthetic matches by fingerprint — the maintainer
      # e-mail in pyproject.toml and the git user.email a test sets up. Any
      # other finding fails the job. pii-mcp is a private repository, so the
      # install needs a token that can read it: the `PII_MCP_TOKEN` secret
      # (fine-grained PAT, Contents: read on ignatenkofi/pii-mcp). Without it
      # — fork PRs, or the secret not configured yet — the check is SKIPPED
      # with a visible warning, never faked green: a job that could not
      # install the tool has not verified anything. Refresh the baseline
      # locally with
      #   pii-mcp verify . --format json   (take the fingerprints you accept)
      # pii-mcp at main, not a tag: the tool has no release yet (0.1.0 only).
      - name: Is the pii-mcp install token available?
        id: pii-token
        env:
          PII_MCP_TOKEN: ${{ secrets.PII_MCP_TOKEN }}
        run: echo "present=${PII_MCP_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: Self-verify (no real PII in the tree)
        if: steps.pii-token.outputs.present == 'yes'
        env:
          PII_MCP_TOKEN: ${{ secrets.PII_MCP_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PII_MCP_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install --quiet "pii-mcp @ git+https://github.com/ignatenkofi/pii-mcp"
          pii-mcp --version
          pii-mcp verify . --baseline tests/pii-baseline.json --format json

      - name: Self-verify skipped (no PII_MCP_TOKEN)
        if: steps.pii-token.outputs.present != 'yes'
        run: echo "::warning title=Self-verify skipped::PII_MCP_TOKEN is not available in this run (fork PR or secret not configured) — the PII self-verify did not run."

      # The three checks above answer "does it import and print its version".
      # They cannot answer "can a client talk to it" — and that is the question
      # this job's name promises. A real client over the real stdio transport:
      # handshake, tool call, resource read.
      - name: Protocol smoke (real client over stdio)
        run: |
          # Файл начинается с importorskip("mcp") — правильно для голого
          # чекаута, но здесь скип означал бы зелёную джобу, не проверившую
          # ничего. Здесь клиент обязан быть, поэтому его отсутствие роняет
          # шаг явно, а не превращается в тихий пропуск.
          python -c "import mcp"
          # И назвать версию: зелёный прогон доказывает совместимость с тем
          # SDK, который реально стоял, а не с тем, что в пине глазами.
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
          pytest tests/test_stdio_protocol.py -v
