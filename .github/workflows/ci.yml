name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full version spread on Linux; one smoke run each on Windows/macOS
        # (the tool is aimed at desktop clients and does a lot of path work).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -v --cov=docshelf_mcp --cov-report=term-missing --cov-fail-under=85

  smoke:
    name: Server smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke check
        run: |
          python -c "from docshelf_mcp.server import mcp; print('OK', mcp)"
          python -c "from docshelf_mcp.core.shelf import Shelf; print('OK', Shelf)"

      - name: Console script smoke
        run: |
          docshelf-mcp --version
          docshelf-mcp --help
