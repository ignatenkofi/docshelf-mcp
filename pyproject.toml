[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docshelf-mcp"
dynamic = ["version"]
description = "MCP server for managing AI-friendly document collections — convert PDFs, split by chapter, index for chat projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Filipp Ignatenko", email = "ignatenkofi@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "claude", "documentation", "pdf", "markdown", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # mcp 2.0.0 removed mcp.server.fastmcp — pin the SDK by major. Lifting
    # this ceiling means porting server.py off FastMCP first; dependabot is
    # told not to propose it (.github/dependabot.yml).
    "mcp>=1.2.0,<2",
    "pydantic>=2.6",
    "pymupdf4llm>=0.0.17",
    # shelf.yml (shelf-spec v0 manifest) scaffolding + doctor's
    # docshelf-config-conflict reconciliation read/write YAML (#63).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
high-quality = [
    "marker-pdf>=1.0.0",
]
docx = [
    "mammoth>=1.6",
]
html = [
    "markdownify>=0.11",
]
epub = [
    "ebooklib>=0.18",
    "markdownify>=0.11",
]
formats = [
    "mammoth>=1.6",
    "markdownify>=0.11",
    "ebooklib>=0.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    # Format backends + a .docx fixture builder, so the DOCX/HTML/EPUB
    # conversion tests run in CI.
    "mammoth>=1.6",
    "markdownify>=0.11",
    "ebooklib>=0.18",
    "python-docx>=1.1",
]

[project.scripts]
docshelf-mcp = "docshelf_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ignatenkofi/docshelf-mcp"
Repository = "https://github.com/ignatenkofi/docshelf-mcp"
Issues = "https://github.com/ignatenkofi/docshelf-mcp/issues"
Changelog = "https://github.com/ignatenkofi/docshelf-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/docshelf_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docshelf_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pdf: tests that require pymupdf4llm (skip if unavailable)",
    "marker: tests that require marker-pdf (skip if unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["docshelf_mcp"]
