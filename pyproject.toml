[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docshelf-mcp"
dynamic = ["version"]
description = "MCP server for managing AI-friendly document collections — convert PDFs, split by chapter, index for chat projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Filipp Ignatenko", email = "ignatenkofi@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "claude", "documentation", "pdf", "markdown", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # Floor at 2.0: server.py imports MCPServer from mcp.server.mcpserver,
    # which does not exist in 1.x (the 1.x name, mcp.server.fastmcp, was
    # removed in 2.0.0) — a 1.x install fails at import, so the range must
    # not admit one. Ceiling by major, same reason as before: the next major
    # gets a port and a run of tests/test_stdio_protocol.py, not a widened
    # range.
    "mcp>=2.0.0,<3",
    # Ceilings by major on everything below, for the same reason the mcp pin
    # has one: an unbounded `>=X` silently admits a breaking major, and the
    # only signal is a user's traceback. mcp 2.0.0 already did exactly that
    # here (#88 — the published 0.3.0 declares `mcp>=1.2.0` and does not start
    # on a fresh install).
    "pydantic>=2.6,<3",
    # No PDF engine here (#93). pymupdf4llm lives in the `pdf` extra below:
    # core.converter already imported it lazily and already told the user how
    # to install it, so the only thing a core pin did was make that branch
    # unreachable — and charge every consumer the ~260 MB pymupdf chain
    # (pymupdf-layout, pymupdf, onnxruntime, numpy, …), including the ones
    # that only ever import core.shelf and never see a PDF.
    # shelf.yml (shelf-spec v0 manifest) scaffolding + doctor's
    # docshelf-config-conflict reconciliation read/write YAML (#63).
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# The default PDF engine (`quality="fast"`). Was a core dependency until
# 0.4.1; moved out because the code already treated it as optional and a
# Markdown-only consumer paid ~260 MB for a branch it never reached (#93).
#
# Floor at 1.0, not the historical 0.0.17: the conversion path had no test
# at all until tests/test_converter.py grew one, so "0.0.17 works" was
# never anything but a claim. What CI actually verifies is whatever pip
# resolves under this range — the 1.x line. The 0.0.x line is a different
# major, two years old, and verified by nothing.
#
# Ceiling on the MINOR, not the major, and that is not sloppiness: this
# package does not use semver. It went 0.3.4 -> 1.27.2.1, adopting PyMuPDF's
# version numbers wholesale, so its breaking changes ride in the minor
# position (1.27 -> 1.28) and the major only moves when PyMuPDF's does.
# A `<2` bound here could not fire for anything pymupdf4llm actually does —
# it would be a guard incapable of failing, which is the exact defect the
# rest of these bounds exist to prevent. Each minor bump arrives as a
# dependabot PR, and the PDF conversion test is what judges it.
pdf = [
    "pymupdf4llm>=1.0,<1.29",
]
high-quality = [
    "marker-pdf>=1.0.0,<2",
]
docx = [
    "mammoth>=1.6,<2",
]
html = [
    "markdownify>=0.11,<2",
]
epub = [
    "ebooklib>=0.18,<1",
    "markdownify>=0.11,<2",
]
formats = [
    "pymupdf4llm>=1.0,<1.29",
    "mammoth>=1.6,<2",
    "markdownify>=0.11,<2",
    "ebooklib>=0.18,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    # Format backends + a .docx fixture builder, so the PDF/DOCX/HTML/EPUB
    # conversion tests run in CI. pymupdf4llm must stay here: the PDF tests
    # importorskip it, so leaving it out would not fail CI — it would turn
    # the package's headline test into a green skip (#93).
    "pymupdf4llm>=1.0,<1.29",
    "mammoth>=1.6,<2",
    "markdownify>=0.11,<2",
    "ebooklib>=0.18,<1",
    "python-docx>=1.1,<2",
]

[project.scripts]
docshelf-mcp = "docshelf_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ignatenkofi/docshelf-mcp"
Repository = "https://github.com/ignatenkofi/docshelf-mcp"
Issues = "https://github.com/ignatenkofi/docshelf-mcp/issues"
Changelog = "https://github.com/ignatenkofi/docshelf-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/docshelf_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docshelf_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pdf: tests that require pymupdf4llm (skip if unavailable)",
    "marker: tests that require marker-pdf (skip if unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["docshelf_mcp"]
